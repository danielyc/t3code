name: Patched nightly

# Rebuilds each upstream T3 Code nightly with the branches in PATCH_BRANCHES
# applied, for macOS, Windows and Linux, and publishes it as a prerelease of
# this fork. Installed builds update from this fork's releases, so they follow
# every new upstream nightly with the patches kept.

# GitHub does not run schedules in this fork, so an hourly cron job outside
# GitHub starts this workflow when a new upstream nightly has no release yet.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream nightly tag (for example v0.1.1-nightly.20261016.3203). Defaults to the latest."
        required: false
        type: string
      rebuild:
        description: "Rebuild even if this fork already has a release for the tag"
        required: false
        default: false
        type: boolean

concurrency:
  group: patched-nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: pingdotgg/t3code
  # Each branch lives in this fork and is applied as its diff against upstream
  # main. When one stops applying, merge upstream main into it and rerun.
  PATCH_BRANCHES: feat/claude-prompt-ghost-text fork/mac-signing-without-passkey-profile
  RELEASE_SUFFIX: -patched
  KEEP_RELEASES: 5

jobs:
  # Resolves the nightly and applies the patches once, so a conflict fails
  # here instead of on every build runner.
  prepare:
    name: Prepare patched source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - id: resolve
        name: Resolve upstream nightly
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REBUILD: ${{ inputs.rebuild }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [[ -z "$tag" ]]; then
            tag="$(gh api "repos/$UPSTREAM_REPOSITORY/releases?per_page=50" --jq \
              '[.[] | select(.draft | not) | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]{8}\\.[0-9]+$"))][0].tag_name // ""')"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$ ]]; then
            echo "::error::No upstream nightly tag found (got '$tag')."
            exit 1
          fi

          release_tag="${tag}${RELEASE_SUFFIX}"
          build=true
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && [[ "${INPUT_REBUILD:-false}" != "true" ]]; then
            echo "$release_tag is already published."
            build=false
          fi

          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "release_tag=$release_tag"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream nightly: $tag (build: $build)"

      # actions/checkout trips over the orphaned gitlinks in upstream's
      # vendored .repos tree, so check out by hand like upstream's release does.
      - name: Checkout upstream nightly
        if: steps.resolve.outputs.build == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git init --quiet .
          git remote add origin "$GITHUB_SERVER_URL/$UPSTREAM_REPOSITORY.git"
          git fetch --quiet --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/tags/$TAG:refs/tags/$TAG"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --quiet --detach "refs/tags/$TAG"

      - name: Apply patch branches
        if: steps.resolve.outputs.build == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add fork "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"

          refspecs=()
          for branch in $PATCH_BRANCHES; do
            refspecs+=("+refs/heads/$branch:refs/remotes/fork/$branch")
          done
          git fetch --no-tags fork "${refspecs[@]}"

          mkdir -p "$RUNNER_TEMP/patch"
          notes="$RUNNER_TEMP/patch/release-notes.md"
          {
            echo "Upstream nightly [\`$TAG\`]($GITHUB_SERVER_URL/$UPSTREAM_REPOSITORY/releases/tag/$TAG) with:"
            echo
          } > "$notes"

          for branch in $PATCH_BRANCHES; do
            head="$(git rev-parse "refs/remotes/fork/$branch")"
            base="$(git merge-base origin/main "$head")"
            echo "Applying $branch (${head:0:10}, diff against upstream main ${base:0:10})"
            if ! git diff --binary "$base" "$head" | git apply --3way --index; then
              echo "::error::$branch does not apply to $TAG. Merge upstream main into $branch, resolve the conflicts, push, and rerun this workflow."
              git diff --name-only --diff-filter=U | sed 's/^/  conflict: /'
              exit 1
            fi
            git commit --quiet --message "Apply $branch (${head:0:10})"
            echo "- \`$branch\` at [\`${head:0:10}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$head)" >> "$notes"
          done
          {
            echo
            echo "macOS builds are signed and notarized. Windows and Linux builds are unsigned, so Windows shows a SmartScreen warning on first install."
          } >> "$notes"

          git diff --binary "refs/tags/$TAG" HEAD > "$RUNNER_TEMP/patch/patched.diff"
          git diff --stat "refs/tags/$TAG" HEAD | tail -n 1

      - name: Upload patch
        if: steps.resolve.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: patch
          path: ${{ runner.temp }}/patch/*
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    needs: [prepare]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.platform == 'win' && 75 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          - label: Windows arm64
            runner: windows-11-arm
            platform: win
            target: nsis
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            target: AppImage
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check signing secrets
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            # Unsigned macOS builds cannot install updates, so never publish one.
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      # actions/checkout trips over the orphaned gitlinks in upstream's
      # vendored .repos tree, so check out by hand like upstream's release does.
      - name: Checkout upstream nightly
        run: |
          set -euo pipefail
          git init --quiet .
          git remote add origin "$GITHUB_SERVER_URL/$UPSTREAM_REPOSITORY.git"
          git fetch --quiet --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --quiet --detach "refs/tags/$TAG"

      - name: Download patch
        uses: actions/download-artifact@v4
        with:
          name: patch
          path: ${{ runner.temp }}/patch

      - name: Apply patch
        run: |
          set -euo pipefail
          git apply --binary --whitespace=nowarn "$RUNNER_TEMP/patch/patched.diff"
          git status --short | tail -n 3
          # Public T3 Connect identifiers, the same ones official builds embed.
          cp .env.example .env

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: true

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v4
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor${{ matrix.platform == 'win' && '.exe' || '' }}
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        # Linux also builds its window capture helpers from source.
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true' || matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win' && steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.${{ matrix.arch == 'arm64' && 'ARM64' || 'x86.x64' }}.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Install Linux desktop build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "$VERSION"

      # Apple's ticket lookup sometimes drops the connection although the app is
      # notarized, and @electron/notarize only retries stapling for a few seconds,
      # so any stapler failure is retried. Apple's timestamp server sometimes
      # answers signing without a timestamp, and nothing retries that at all.
      - name: Retry stapler and codesign timestamps
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          shim_dir="$RUNNER_TEMP/apple-retry"
          mkdir -p "$shim_dir"
          cat > "$shim_dir/xcrun" <<'EOF'
          #!/bin/bash
          if [ "${1:-}" != stapler ]; then exec /usr/bin/xcrun "$@"; fi
          attempt=1
          until /usr/bin/xcrun "$@"; do
            status=$?
            if [ "$attempt" -ge 6 ]; then exit "$status"; fi
            echo "xcrun $*: attempt $attempt failed with $status, retrying" >&2
            sleep $((attempt < 4 ? attempt * 30 : 120))
            attempt=$((attempt + 1))
          done
          EOF
          # Only forced signing is safe to repeat as is.
          cat > "$shim_dir/codesign" <<'EOF'
          #!/bin/bash
          forced=false
          signing=false
          for arg in "$@"; do
            case "$arg" in
              --force) forced=true ;;
              --sign) signing=true ;;
            esac
          done
          if [ "$forced" != true ] || [ "$signing" != true ]; then exec /usr/bin/codesign "$@"; fi
          stderr_file="$(mktemp)"
          trap 'rm -f "$stderr_file"' EXIT
          attempt=1
          while true; do
            status=0
            /usr/bin/codesign "$@" 2>"$stderr_file" || status=$?
            cat "$stderr_file" >&2
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -ge 5 ] || ! grep -q "A timestamp was expected but was not found" "$stderr_file"; then
              exit "$status"
            fi
            echo "codesign: attempt $attempt got no timestamp, retrying" >&2
            sleep $((attempt * 15))
            attempt=$((attempt + 1))
          done
          EOF
          chmod +x "$shim_dir/xcrun" "$shim_dir/codesign"
          echo "$shim_dir" >> "$GITHUB_PATH"

      - name: Build desktop artifact
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          # Installed builds look for updates in this fork's releases.
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "$VERSION"
            --output-dir release
            --verbose
          )
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
            args+=(--signed)
          else
            # electron-builder signs on its own when it finds these.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          # Runner network outages (DNS for the Electron download, Apple's ticket
          # lookup while stapling) can outlast the tools' own retries, so a build
          # that failed on one gets a second full run.
          log="$RUNNER_TEMP/build-desktop-artifact.log"
          attempt=1
          while true; do
            status=0
            node scripts/build-desktop-artifact.ts "${args[@]}" 2>&1 | tee "$log" || status=$?
            if [[ "$status" -eq 0 ]]; then break; fi
            if [[ "$attempt" -ge 2 ]] || ! grep -q -E "ENOTFOUND|EAI_AGAIN|ETIMEDOUT|ECONNRESET|ECONNREFUSED|socket hang up|The network connection was lost|Failed to staple" "$log"; then
              exit "$status"
            fi
            echo "::warning::Build attempt $attempt failed on a network error, retrying."
            rm -rf release
            sleep 60
            attempt=$((attempt + 1))
          done

      - name: Verify macOS signature, notarization and update feed
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          mount_dir="$(mktemp -d)"
          hdiutil attach release/*.dmg -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null
          trap 'hdiutil detach -force "$mount_dir" >/dev/null' EXIT
          app="$(find "$mount_dir" -maxdepth 1 -name '*.app' | head -n 1)"
          echo "App: $app"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
          grep -q "owner: ${GITHUB_REPOSITORY%%/*}" "$app/Contents/Resources/app-update.yml"

      - name: Collect release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-publish
          for file in release/*.dmg release/*.zip release/*.AppImage release/*.exe release/*.blockmap release/*.yml; do
            [[ "$file" == */builder-debug.yml ]] && continue
            cp "$file" release-publish/
          done

          # One updater manifest per platform and channel lists every arch, so
          # per-arch copies get distinct names and the publish job merges them.
          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" != "arm64" ]]; then
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-${{ matrix.arch }}.yml"
            done
          fi
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            for manifest in release-publish/*.yml; do
              mv "$manifest" "${manifest%.yml}-win-${{ matrix.arch }}.yml"
            done
          fi
          ls -la release-publish

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  # Publishes only when every platform built, because an updater whose
  # manifest is missing from the newest release cannot find any update.
  publish:
    name: Publish ${{ needs.prepare.outputs.release_tag }}
    needs: [prepare, build]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      # actions/checkout trips over the orphaned gitlinks in upstream's
      # vendored .repos tree, so check out by hand like upstream's release does.
      - name: Checkout upstream nightly
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet .
          git remote add origin "$GITHUB_SERVER_URL/$UPSTREAM_REPOSITORY.git"
          git fetch --quiet --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --quiet --detach "refs/tags/$TAG"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Download patch
        uses: actions/download-artifact@v4
        with:
          name: patch
          path: ${{ runner.temp }}/patch

      - name: Merge updater manifests
        run: |
          set -euo pipefail
          shopt -s nullglob
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
            rm -f "$x64_manifest"
          done
          for x64_manifest in release-assets/*-win-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}-arm64.yml"
            merged_manifest="${x64_manifest%-win-x64.yml}.yml"
            node scripts/merge-update-manifests.ts --platform win "$x64_manifest" "$arm64_manifest" "$merged_manifest"
            rm -f "$x64_manifest" "$arm64_manifest"
          done
          for manifest in nightly-mac.yml nightly.yml nightly-linux.yml nightly-linux-arm64.yml; do
            test -f "release-assets/$manifest" || { echo "::error::Missing updater manifest $manifest"; exit 1; }
          done
          ls -la release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The built commit itself is not pushed: it carries upstream workflow
          # changes, which the workflow token may not push. The notes name the
          # upstream tag and each branch head instead. The tag lands on the
          # default branch head at publish time, because GitHub refuses a tag on
          # this run's commit once that branch has moved to other workflow files.
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --latest=false \
            --title "T3 Code Nightly $VERSION (patched)" \
            --notes-file "$RUNNER_TEMP/patch/release-notes.md" \
            release-assets/*

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # createdAt is the tagged commit's date, which every release shares
          # because tags land on the branch head; only publishedAt orders them.
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,publishedAt \
            --jq "[.[] | select(.tagName | endswith(\"$RELEASE_SUFFIX\"))] | sort_by(.publishedAt) | reverse | .[$KEEP_RELEASES:][].tagName" |
            while read -r old_tag; do
              echo "Deleting $old_tag"
              gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
